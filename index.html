<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Control</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --red: #E40520;
    --red-dark: #B40418;
    --red-soft: #FCE6E9;
    --ink: #0F172A;
    --muted: #64748B;
    --line: #E2E8F0;
    --bg: #F8FAFC;
    --white: #FFFFFF;
    --green: #15803D;
    --green-bg: #F0FDF4;
    --gray: #94A3B8;
    --gray-bg: #F1F5F9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    font-size: 14px;
  }

  /* Header */
  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: var(--white);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  header.top .logo { height: 56px; display: block; }
  header.top .brand-title { font-size: 20px; font-weight: 700; color: var(--ink); letter-spacing: -0.2px; }
  header.top .actions { display: flex; gap: 8px; align-items: center; }

  button {
    font-family: inherit;
    font-size: 14px;
    border: 1px solid var(--line);
    background: var(--white);
    color: var(--ink);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 500;
    transition: all .15s;
  }
  button:hover:not(:disabled) { background: var(--gray-bg); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary {
    background: var(--red);
    color: var(--white);
    border-color: var(--red);
  }
  button.primary:hover:not(:disabled) { background: var(--red-dark); border-color: var(--red-dark); }
  button.primary:disabled { background: var(--gray); border-color: var(--gray); }
  button.ghost { border-color: transparent; }

  /* Tabs row */
  nav.tabs-row {
    display: flex;
    gap: 4px;
    padding: 8px 24px 0;
    background: var(--white);
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    scrollbar-width: thin;
    position: sticky;
    top: 89px;
    z-index: 40;
  }
  nav.tabs-row .tab {
    padding: 10px 16px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-weight: 500;
    font-size: 14px;
    border-bottom: 3px solid transparent;
    border-radius: 0;
    margin-bottom: -1px;
    cursor: pointer;
    white-space: nowrap;
    transition: all .15s;
  }
  nav.tabs-row .tab:hover { color: var(--ink); background: transparent; }
  nav.tabs-row .tab.active {
    color: var(--red);
    border-bottom-color: var(--red);
    font-weight: 600;
  }
  nav.tabs-row .tab.add-tab {
    color: var(--muted);
    font-style: italic;
    margin-left: 8px;
    padding-left: 12px;
    border-left: 1px solid var(--line);
  }
  nav.tabs-row .tab.add-tab:hover { color: var(--red); }

  /* Active clone header */
  .clone-header {
    padding: 16px 24px 0;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .clone-header .clone-name {
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
  }
  .clone-header .clone-slug {
    font-size: 12px;
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  /* Stats */
  .stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    padding: 16px 24px 0;
  }
  .stat {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .stat .label {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .5px;
    font-weight: 600;
  }
  .stat .value {
    font-size: 22px;
    font-weight: 700;
    margin-top: 4px;
    color: var(--ink);
  }
  .stat .sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }
  .stat.red .value { color: var(--red); }

  /* Toolbar */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 24px;
    flex-wrap: wrap;
  }
  .search {
    flex: 1;
    min-width: 240px;
    max-width: 420px;
    position: relative;
  }
  .search input {
    width: 100%;
    padding: 9px 12px 9px 34px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: var(--white);
  }
  .search input:focus { outline: 2px solid var(--red); outline-offset: -1px; border-color: var(--red); }
  .search::before {
    content: '🔍';
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    opacity: .5;
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    background: var(--red-soft);
    color: var(--red-dark);
    border: 1px solid var(--red);
    border-radius: 100px;
    padding: 4px 10px;
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 500;
  }
  .chip button {
    border: none;
    background: transparent;
    color: var(--red-dark);
    padding: 0;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
  }

  /* Table */
  .table-wrap {
    margin: 0 24px 24px;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: auto;
    max-height: calc(100vh - 360px);
  }
  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 13px;
  }
  thead th {
    position: sticky;
    top: 0;
    background: var(--white);
    border-bottom: 2px solid var(--line);
    text-align: left;
    padding: 10px 12px;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .3px;
    color: var(--muted);
    white-space: nowrap;
    z-index: 10;
  }
  thead th .th-inner {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
  }
  thead th .th-inner:hover { color: var(--ink); }
  thead th .filter-btn {
    border: none;
    background: transparent;
    padding: 0 2px;
    color: var(--muted);
    cursor: pointer;
    font-size: 11px;
  }
  thead th .filter-btn.active { color: var(--red); }
  thead th .sort-ind { font-size: 10px; opacity: .6; }
  thead th .sort-ind.inactive { opacity: .25; }
  thead th .th-inner:hover .sort-ind.inactive { opacity: .6; }

  tbody td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  tbody tr:hover td { background: var(--bg); }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 500;
  }
  .pill.yes { background: var(--green-bg); color: var(--green); }
  .pill.no  { background: var(--gray-bg); color: var(--gray); }
  .pill.os-ios { background: #EFF6FF; color: #1D4ED8; }
  .pill.os-android { background: #F0FDF4; color: #15803D; }
  .pill.os-other { background: var(--gray-bg); color: var(--muted); }
  .rating {
    display: inline-block;
    font-weight: 700;
    color: var(--red);
  }
  .empty-cell { color: var(--gray); font-style: italic; }

  /* Filter popover */
  .popover {
    position: absolute;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 12px 40px rgba(0,0,0,.12);
    padding: 12px;
    min-width: 240px;
    z-index: 100;
  }
  .popover h4 {
    margin: 0 0 8px;
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .5px;
    font-weight: 600;
  }
  .popover label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    cursor: pointer;
    font-size: 13px;
  }
  .popover input[type="checkbox"] { accent-color: var(--red); }
  .popover input[type="text"], .popover input[type="number"], .popover input[type="date"] {
    width: 100%;
    padding: 6px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    margin: 4px 0;
  }
  .popover .row { display: flex; gap: 6px; }
  .popover .actions {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
  }
  .popover .actions button { padding: 5px 10px; font-size: 12px; }
  .popover .opts-list { max-height: 220px; overflow-y: auto; }

  /* Modal */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  .modal {
    background: var(--white);
    border-radius: 12px;
    max-width: 800px;
    width: 100%;
    max-height: 90vh;
    overflow: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }
  .modal h2 {
    margin: 0;
    padding: 18px 24px;
    border-bottom: 1px solid var(--line);
    font-size: 18px;
  }
  .modal .body { padding: 20px 24px; }
  .modal .body input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
  }
  .modal .body input[type="text"]:focus { outline: 2px solid var(--red); outline-offset: -1px; border-color: var(--red); }
  .modal .footer {
    padding: 14px 24px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .preview-table {
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: auto;
    max-height: 400px;
    margin-top: 12px;
  }
  .preview-table table { font-size: 12px; }
  .preview-table th { font-size: 10px; }
  .preview-table td { padding: 6px 10px; }
  .target-clone {
    background: var(--red-soft);
    color: var(--red-dark);
    border: 1px solid var(--red);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 12px;
  }
  .map-pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .map-pill {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: var(--gray-bg);
    color: var(--muted);
  }
  .map-pill.mapped { background: var(--green-bg); color: var(--green); border-color: var(--green); }
  .map-pill.unmapped { background: #FFFBEB; color: #B45309; border-color: #F59E0B; }
  .map-pill strong { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .sync-box {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    margin: 12px 0;
    background: var(--bg);
  }
  .sync-box .warn-box {
    background: #FFFBEB; color: #B45309; border: 1px solid #F59E0B;
    border-radius: 6px; padding: 8px 10px; font-size: 13px;
  }
  .sync-box .danger-box {
    background: var(--red-soft); color: var(--red-dark); border: 1px solid var(--red);
    border-radius: 6px; padding: 8px 10px; font-size: 13px;
  }
  .sync-box .muted-note { color: var(--muted); font-size: 13px; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--ink);
    color: var(--white);
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    z-index: 300;
    box-shadow: 0 8px 24px rgba(0,0,0,.2);
    animation: slideIn .2s ease-out;
  }
  .toast.error { background: var(--red); }
  .toast.success { background: #15803D; }
  @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .empty-state {
    text-align: center;
    padding: 60px 24px;
    color: var(--muted);
  }
  .empty-state h3 { color: var(--ink); margin: 0 0 8px; }

  .loading {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--line);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Mobile */
  @media (max-width: 900px) {
    .stats { grid-template-columns: repeat(3, 1fr); }
    header.top { padding: 12px 16px; }
    header.top .logo { height: 44px; }
    header.top .brand-title { font-size: 17px; }
    .toolbar, .stats, .clone-header { padding-left: 16px; padding-right: 16px; }
    nav.tabs-row { padding-left: 16px; padding-right: 16px; }
    .table-wrap { margin: 0 16px 16px; }
  }
  @media (max-width: 540px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    header.top .logo { height: 36px; }
    header.top .brand-title { font-size: 15px; }
    .stat .value { font-size: 18px; }
  }

  /* Login */
  .login-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 500;
    padding: 20px;
  }
  .login-card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,.08);
    padding: 32px;
    width: 100%;
    max-width: 380px;
  }
  .login-card img.logo { height: 52px; display: block; margin: 0 auto 8px; }
  .login-card .brand-title-login { font-size: 22px; font-weight: 700; color: var(--ink); text-align: center; margin: 4px 0 4px; }
  .login-card .sub {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 24px;
  }
  .login-card label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .3px;
    margin: 14px 0 4px;
  }
  .login-card input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
  }
  .login-card input:focus { outline: 2px solid var(--red); outline-offset: -1px; border-color: var(--red); }
  .login-card button.primary {
    width: 100%;
    margin-top: 22px;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
  }
  .login-card .error {
    background: var(--red-soft);
    color: var(--red-dark);
    border: 1px solid var(--red);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 13px;
    margin-top: 16px;
    display: none;
  }
  .login-card .error.show { display: block; }
  /* Hasta que el JS decide si hay sesión, ocultamos la app para que no
     parpadee el panel sin login */
  body.booting header.top,
  body.booting nav.tabs-row,
  body.booting .clone-header,
  body.booting .stats,
  body.booting .toolbar,
  body.booting .table-wrap { display: none; }
</style>
</head>
<body class="booting">

<header class="top">
  <div class="brand-title">Panel de Control</div>
  <div class="actions">
    <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
    <button class="ghost" onclick="exportCsv()">Exportar CSV</button>
    <button class="primary" id="uploadBtn" onclick="document.getElementById('fileInput').click()">Subir Excel</button>
    <button class="ghost" id="logoutBtn" onclick="doLogout()" title="Cerrar sesión">Cerrar sesión</button>
  </div>
</header>

<nav class="tabs-row" id="tabsRow"></nav>

<section class="clone-header" id="cloneHeader"></section>

<section class="stats" id="stats"></section>

<div class="toolbar">
  <div class="search">
    <input type="text" id="globalSearch" placeholder="Buscar nombre, email, teléfono…" oninput="onGlobalSearch(event)">
  </div>
  <div class="chips" id="filterChips"></div>
  <div style="margin-left:auto;color:var(--muted);font-size:12px;" id="rowCount"></div>
</div>

<div class="table-wrap" id="tableWrap"></div>

<div id="modalRoot"></div>
<div id="popoverRoot"></div>
<div id="toastRoot"></div>

<script>
//===============================================================
// Config
//===============================================================
const SB_URL = 'https://udlkorcjenhixpuseney.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkbGtvcmNqZW5oaXhwdXNlbmV5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzMzUyODAsImV4cCI6MjA4ODkxMTI4MH0.I7cTG9Tkn2RX5ledviEvfoH7Psw67DmfysfHu02oIXg';
const CLONES_TABLE = 'clones';
const USERS_TABLE = 'clone_users';

// Cliente Supabase Auth (login email+password, sesión persistente en localStorage).
const supa = window.supabase.createClient(SB_URL, SB_KEY, {
  auth: { persistSession: true, autoRefreshToken: true },
});
// Sesión actual (null = sin login). Se rellena en el boot.
let session = null;

// Excel column letters (real positions, NOT the header text — see CLAUDE.md)
// Te acompaña fallback (Quadram export con desfase de 2 columnas, sin headers
// reconocibles para 'phone'). Se usa solo si la detección por cabeceras falla.
const TA_FALLBACK_MAP = {
  user_id:              'D',

  model:                'H',

// Sinónimos de cabeceras (normalizados: solo a-z0-9). Cubre el formato Safy
// original, Te acompaña/Quadram, y formatos en español/inglés. Primer match
// gana, así que pongo los más específicos primero. Para añadir un formato
// nuevo basta con sumar sinónimos a la lista del campo correspondiente.
const FIELD_SYNONYMS = {
  user_id:              ['idusuario', 'userid', 'iduser'],
  country_code:         ['codigopais', 'codpais', 'countrycode'],
  phone:                ['telefono', 'phone', 'tel', 'movil'],
  brand:                ['marca', 'brand'],
  model:                ['modelo', 'model'],
  first_name:           ['nombre', 'firstname', 'name'],
  last_name:            ['apellidos', 'apellido', 'lastname', 'surname'],
  email:                ['email', 'correo', 'mail'],
  age:                  ['edad', 'age'],
  registered_at:        ['fecharegistro', 'fechacreacion', 'createdatdate', 'createdat', 'registrationdate'],
  app_rating:           ['apprating', 'valoracion', 'valoracionapp', 'rating'],

  has_security_group:   ['telefonosconfianza', 'hastrustedphones', 'gruposeguridad', 'gruposeguro'],

const COLS = [
  { key: 'country_code',        label: 'Cód. País',     type: 'multi',     align: 'center' },
  { key: 'phone',               label: 'Teléfono',       type: 'text' },
  { key: 'os',                  label: 'SO',             type: 'multi',    align: 'center' },
  { key: 'brand',               label: 'Marca',          type: 'multi' },
  { key: 'first_name',          label: 'Nombre',         type: 'text' },
  { key: 'last_name',           label: 'Apellidos',      type: 'text' },
  { key: 'email',               label: 'Email',          type: 'text' },
  { key: 'age',                 label: 'Edad',           type: 'numrange', align: 'center' },
  { key: 'registered_at',       label: 'Fecha registro', type: 'daterange', align: 'center' },
  { key: 'app_rating',          label: 'Valoración',     type: 'numrange', align: 'center' },
  { key: 'has_alerts',          label: 'Alertas SOS',    type: 'bool',     align: 'center' },
  { key: 'has_security_group',  label: 'Grupo Seg.',     type: 'bool',     align: 'center' },
  { key: 'used_acompana',       label: 'Acompaña',       type: 'bool',     align: 'center' },
  { key: 'used_night_security', label: 'Seg. Nocturna',  type: 'bool',     align: 'center' },
  { key: 'has_widget',          label: 'Widget',         type: 'bool',     align: 'center' },
];

//===============================================================
// State
//===============================================================
const state = {
  clones: [],            // [{ slug, name, position, created_at }]
  activeClone: null,
  rows: [],              // users for activeClone
  filters: {},
  sort: { col: 'registered_at', dir: 'desc' },
  globalSearch: '',
  preview: null,
  isMaster: false,       // true = ve todos los clones y puede subir/añadir
  loading: false,        // true mientras se cargan los usuarios de un clon
  rowsLoadedSlug: null,  // slug del clon cuyo censo está realmente cargado en rows
};

// Máximo de filas pintadas en la tabla a la vez. Los filtros, conteos y el
// export CSV siguen operando sobre TODAS las filas; esto solo limita cuántos
// <tr> se meten en el DOM, para que un clon enorme (p.ej. Safy ~53k) no
// congele el navegador. Si hay más, se muestra un aviso para acotar con filtros.
const MAX_RENDER_ROWS = 1000;

//===============================================================
// Supabase helper
//===============================================================
async function sb(path, opts = {}) {
  const { headers: extra, ...rest } = opts;
  // Con sesión, usamos el JWT del usuario como Bearer → la RLS aplica por clon.
  // Sin sesión, cae a la anon key (que ya no tiene acceso a clones/clone_users).
  const bearer = session?.access_token || SB_KEY;
  const res = await fetch(SB_URL + '/rest/v1/' + path, {
    headers: {
      'apikey': SB_KEY,
      'Authorization': 'Bearer ' + bearer,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
      ...(extra || {}),
    },
    ...rest,
  });
  const txt = await res.text();
  if (!res.ok) throw new Error(`Supabase ${res.status}: ${txt}`);
  return txt ? JSON.parse(txt) : null;
}

//===============================================================
// Loading
//===============================================================
async function loadClones() {
  state.clones = await sb(`${CLONES_TABLE}?select=*&order=position.asc.nullslast,name.asc`);
}

async function loadUsers() {
  if (!state.activeClone) { state.rows = []; state.rowsLoadedSlug = null; return; }
  const slugRaw = state.activeClone;
  const slug = encodeURIComponent(slugRaw);
  state.rowsLoadedSlug = null;           // se marca al terminar con éxito
  const rows = [];
  let offset = 0;
  const limit = 1000;
  while (true) {
    // Orden TOTAL y estable (desempate por id, PK única) para que la paginación
    // no salte ni duplique filas entre páginas → state.rows es el censo exacto.
    const page = await sb(`${USERS_TABLE}?select=*&clone_slug=eq.${slug}&order=registered_at.desc.nullslast,id.asc&limit=${limit}&offset=${offset}`);
    rows.push(...page);
    if (page.length < limit) break;
    offset += limit;
  }
  state.rows = rows;
  state.rowsLoadedSlug = slugRaw;        // censo cargado y completo para este clon
}

// Lee SOLO los user_id actuales de un clon, frescos de la BD (para recomputar
// las bajas en el momento de confirmar, sin depender de la foto del preview).
async function fetchCloneUserIds(slugRaw) {
  const slug = encodeURIComponent(slugRaw);
  const ids = [];
  let offset = 0;
  const limit = 1000;
  while (true) {
    const page = await sb(`${USERS_TABLE}?select=user_id&clone_slug=eq.${slug}&order=id.asc&limit=${limit}&offset=${offset}`);
    ids.push(...page.map(r => r.user_id).filter(v => v != null && v !== ''));
    if (page.length < limit) break;
    offset += limit;
  }
  return ids;
}

function getActiveClone() {
  return state.clones.find(c => c.slug === state.activeClone) || null;
}

async function switchClone(slug) {
  if (slug === state.activeClone) return;
  state.activeClone = slug;
  state.filters = {};
  state.globalSearch = '';
  const gs = document.getElementById('globalSearch');
  if (gs) gs.value = '';
  sessionStorage.setItem(SS_KEY, slug || '');
  state.rows = [];
  state.loading = true;
  render();                  // feedback inmediato: muestra "Cargando…"
  try {
    await loadUsers();
  } catch (err) {
    console.error(err);
    toast(err.message || 'Error cargando datos del clon', 'error');
  } finally {
    state.loading = false;
  }
  render();
}

//===============================================================
// Add clone
//===============================================================
function slugify(s) {
  return String(s || '')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/ñ/g, 'n')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 60);
}

function openAddCloneModal() {
  const html = `
    <div class="backdrop" onclick="if(event.target===this)closeModal()">
      <div class="modal" style="max-width:480px">
        <h2>Añadir clon</h2>
        <div class="body">
          <label style="display:block;margin-bottom:6px;font-weight:500;">Nombre del clon</label>
          <input type="text" id="newCloneName" placeholder="Ej. Mi Nuevo Clon" autofocus
                 oninput="document.getElementById('newCloneSlug').textContent = slugify(this.value) || '—'"
                 onkeydown="if(event.key==='Enter') confirmAddClone()">
          <p style="margin-top:12px;font-size:12px;color:var(--muted);">
            Slug interno: <code id="newCloneSlug" style="background:var(--gray-bg);padding:2px 6px;border-radius:4px;">—</code>
          </p>
          <p style="font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5;">
            Se creará una pestaña nueva vacía. Podrás subir el Excel del clon
            inmediatamente después y los datos quedarán aislados de los otros clones.
          </p>
        </div>
        <div class="footer">
          <button onclick="closeModal()">Cancelar</button>
          <button class="primary" onclick="confirmAddClone()">Crear clon</button>
        </div>
      </div>
    </div>`;
  document.getElementById('modalRoot').innerHTML = html;
  setTimeout(() => document.getElementById('newCloneName')?.focus(), 50);
}

async function confirmAddClone() {
  const name = (document.getElementById('newCloneName')?.value || '').trim();
  if (!name) { toast('Pon un nombre para el clon', 'error'); return; }
  const slug = slugify(name);
  if (!slug) { toast('Ese nombre no genera un slug válido', 'error'); return; }
  if (state.clones.some(c => c.slug === slug)) {
    toast(`Ya existe un clon con slug "${slug}". Prueba otro nombre.`, 'error');
    return;
  }
  try {
    const maxPos = state.clones.reduce((m, c) => Math.max(m, c.position || 0), 0);
    await sb(CLONES_TABLE, {
      method: 'POST',
      headers: { 'Prefer': 'return=minimal' },
      body: JSON.stringify({ slug, name, position: maxPos + 1 }),
    });
    closeModal();
    toast(`Clon "${name}" creado.`, 'success');
    await loadClones();
    await switchClone(slug);
  } catch (err) {
    console.error(err);
    toast(err.message || 'Error creando clon', 'error');
  }
}

//===============================================================
// Excel parsing
//===============================================================
function cellText(ws, addr) {
  const c = ws[addr];
  if (!c) return '';
  if (c.w !== undefined) return String(c.w).trim();
  if (c.v !== undefined) return String(c.v).trim();
  return '';
}
// Lectura de IDENTIDAD/clave (user_id): SIEMPRE el valor crudo (c.v), NUNCA el
// formateado (c.w), que para números grandes puede venir en notación científica
// o con separadores y no casaría con el user_id canónico de la BD (provocaría
// falsas bajas al sincronizar). Normaliza enteros a su string decimal completo.
function cellId(ws, addr) {
  const c = ws[addr];
  if (!c || c.v === undefined || c.v === null) return '';
  if (typeof c.v === 'number') {
    return Number.isInteger(c.v) ? BigInt(c.v).toString() : String(c.v);
  }
  return String(c.v).trim();
}
function cellNum(ws, addr) {
  const c = ws[addr];
  if (!c || c.v === undefined || c.v === '') return null;
  const n = Number(c.v);
  return Number.isFinite(n) ? n : null;
}
function cellBool(ws, addr) {
  const t = cellText(ws, addr).toLowerCase();
  if (!t) return false;
  return t === '1' || t === 'true' || t === 'sí' || t === 'si' || t === 'yes' || t === 'y';
}
function cellDateISO(ws, addr) {
  const c = ws[addr];
  if (!c) return null;
  if (c.w) {
    const m = String(c.w).match(/(\d{4})-(\d{2})-(\d{2})/);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    const m2 = String(c.w).match(/(\d{2})\/(\d{2})\/(\d{4})/);
    if (m2) return `${m2[3]}-${m2[2]}-${m2[1]}`;
  }
  if (typeof c.v === 'number') {
    const d = XLSX.SSF.parse_date_code(c.v);
    if (d) return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
  }
  if (typeof c.v === 'string') {
    const m = c.v.match(/(\d{4})-(\d{2})-(\d{2})/);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  }
  return null;
}

// Normaliza un header para buscar en FIELD_SYNONYMS: minúsculas, NFD,
// strip diacríticos y deja solo a-z0-9. "Codigo_Pais" → "codigopais",
// "Teléfono" → "telefono", "App Rating" → "apprating".
function normalizeHeader(s) {
  return String(s || '')
    .toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/ñ/g, 'n')
    .replace(/[^a-z0-9]/g, '');
}

// Lee la cabecera (primera fila del rango) y devuelve un mapa
// {field → letraColumna}. Si no encuentra un campo, simplemente no
// aparece en el resultado.
function detectColumnMap(ws, range) {
  const headers = {};            // letter → normalized header text
  for (let c = range.s.c; c <= range.e.c; c++) {
    const cellRef = XLSX.utils.encode_cell({ r: range.s.r, c });
    const letter = XLSX.utils.encode_col(c);
    const txt = cellText(ws, cellRef);
    if (txt) headers[letter] = normalizeHeader(txt);
  }
  const map = {};
  for (const [field, syns] of Object.entries(FIELD_SYNONYMS)) {
    for (const [letter, h] of Object.entries(headers)) {
      if (syns.includes(h)) { map[field] = letter; break; }
    }
  }
  return { headers, map };
}

// Nombres de cabecera (normalizados) del export Te acompaña/Quadram.
// Los DATOS de cada campo están 2 columnas a la DERECHA de su cabecera.
const TA_HEADER_NAMES = {
  user_id:              'id',
  country_code:         'code',
  phone:                'phone',
  brand:                'brand',
  model:                'model',
  first_name:           'name',
  last_name:            'lastname',
  email:                'email',
  age:                  'age',
  registered_at:        'createdatdate',
  app_rating:           'apprating',
  os:                   'os',
  has_alerts:           'hasalerts',
  has_security_group:   'hastrustedphones',
  used_acompana:        'centinelacount',
  used_night_security:  'nightalarmcount',
  has_widget:           'activewidget',
};

// Mapeo dinámico del export TA: cabecera conocida + 2 columnas = columna de
// datos real. Inmune a que Quadram inserte/quite columnas intermedias
// (mientras mantenga su desfase histórico de 2 cabeceras que faltan al inicio).
function taDynamicMap(headers) {
  const byName = {};
  for (const [letter, name] of Object.entries(headers)) {
    if (!(name in byName)) byName[name] = letter;   // primera aparición gana
  }
  const map = {};
  for (const [field, hname] of Object.entries(TA_HEADER_NAMES)) {
    const letter = byName[hname];
    if (letter) map[field] = XLSX.utils.encode_col(XLSX.utils.decode_col(letter) + 2);
  }
  return map;
}

// ¿La columna `letter` contiene mayoritariamente valores con pinta de teléfono?
// Probamos las 30 primeras filas no vacías. >50% deben ser dígitos 6-15 chars.
function columnLooksLikePhones(ws, letter, range) {
  let matches = 0, samples = 0;
  for (let r = range.s.r + 1; r <= Math.min(range.s.r + 30, range.e.r); r++) {
    const v = cellText(ws, letter + (r + 1));
    if (!v) continue;
    samples++;
    if (/^\d{6,15}$/.test(v)) matches++;
  }
  return samples >= 3 && matches / samples > 0.5;
}

function parseExcel(buf) {
  const wb = XLSX.read(buf, { type: 'array', cellDates: false });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const ref = ws['!ref'];
  if (!ref) throw new Error('La hoja está vacía');
  const range = XLSX.utils.decode_range(ref);

  // Estrategia 1: detectar columnas por sinónimos de cabecera (Safy, futuros formatos).
  let { headers, map } = detectColumnMap(ws, range);

  // SANITY CHECK: la columna detectada como `phone` tiene que contener
  // valores con pinta de teléfono. Algunos exports (Te acompaña/Quadram)
  // tienen cabeceras desplazadas y pueden engañar al matcher de sinónimos
  // (p.ej. "phone" aparece en col D pero los datos de col D son user_ids
  // pequeños tipo 1, 3, 4…). Si no pasa el check, descartamos toda la
  // detección y caemos al fallback Te acompaña.
  if (map.phone && !columnLooksLikePhones(ws, map.phone, range)) {
    map = {};
  }

  // Estrategia 2 (fallback Te acompaña): si no hay 'phone' válido, probamos
  // si las columnas F (teléfono) y E (cód. país) cuadran y, en ese caso,
  // asumimos el export de Quadram con su desfase de +2 columnas.
  if (!map.phone) {
    let teAcompanaLikely = false;
    for (let r = range.s.r + 2; r <= Math.min(range.s.r + 10, range.e.r + 1); r++) {
      const f = cellText(ws, 'F' + r);
      const e = cellText(ws, 'E' + r);
      if (/^\d{6,15}$/.test(f) && /^\d{1,4}$/.test(e)) { teAcompanaLikely = true; break; }
    }
    if (teAcompanaLikely) {
      // Mapeo DINÁMICO: en el export TA los datos van SIEMPRE 2 columnas a la
      // derecha de su cabecera (al export le faltan 2 cabeceras iniciales).
      // En vez de letras fijas, localizamos cada cabecera conocida y sumamos
      // +2. Así, si Quadram inserta/quita columnas (jul-2026: añadió
      // protectorsCount y desplazó centinela/nightAlarm/widget), el mapeo se
      // auto-corrige. Si faltan cabeceras, caemos al mapa fijo histórico.
      const dyn = taDynamicMap(headers);
      const dynOk = dyn.phone && dyn.user_id && columnLooksLikePhones(ws, dyn.phone, range);
      map = dynOk ? dyn : { ...TA_FALLBACK_MAP };
    }
  }

  if (!map.phone) {
    const sample = Object.entries(headers).slice(0, 8).map(([l,h]) => `${l}=${h}`).join(', ');
    throw new Error(`No se ha encontrado columna de teléfono válida en el Excel. Cabeceras detectadas: ${sample || '(vacías)'}…`);
  }

  if (!map.user_id) {
    const sample = Object.entries(headers).slice(0, 8).map(([l,h]) => `${l}=${h}`).join(', ');
    throw new Error(`No se ha encontrado columna de user_id en el Excel. La clave de upsert es (clon, user_id). Cabeceras detectadas: ${sample || '(vacías)'}…`);
  }

  // Iterar filas. La cabecera es range.s.r (fila 1 del rango).
  // Deduplicamos por user_id (la clave de upsert): si un user_id aparece
  // dos veces en el Excel, nos quedamos con la última ocurrencia. Esto
  // es imprescindible porque PostgREST no permite que un mismo
  // `ON CONFLICT` afecte a la misma fila destino dos veces en un batch.
  // Filtramos también filas sin teléfono (cuentas admin/test internas)
  // para mantener el conteo del panel a "usuarios reales registrados".
  const byUserId = new Map();
  const allUserIds = new Set();   // TODOS los user_id presentes en el Excel (con o sin teléfono)
  let skippedNoPhone = 0;
  let skippedNoUserId = 0;
  let uploadRows = 0;
  for (let r = range.s.r + 1; r <= range.e.r; r++) {
    const at = (col) => col ? col + (r + 1) : null;
    // El user_id (identidad) se lee PRIMERO y en crudo, y determina la
    // presencia en el Excel con independencia del teléfono. Así, un usuario
    // que viene en el Excel pero con teléfono vacío NO se contará como baja
    // al sincronizar (su user_id sigue en allUserIds).
    const userId = cellId(ws, at(map.user_id));
    if (!userId) { skippedNoUserId++; continue; }
    allUserIds.add(userId);
    const phone = cellText(ws, at(map.phone));
    if (!phone) { skippedNoPhone++; continue; }   // no se sube, pero SÍ cuenta como presente
    uploadRows++;

    // Para los contadores (Acompaña, Seg. Nocturna), >0 → true.
    const acompanaRaw = map.used_acompana ? cellNum(ws, at(map.used_acompana)) : null;
    const nightRaw    = map.used_night_security ? cellNum(ws, at(map.used_night_security)) : null;

    byUserId.set(userId, {
      user_id:              userId,
      country_code:         map.country_code   ? (cellText(ws, at(map.country_code)) || null) : null,
      phone:                phone,
      brand:                map.brand          ? (cellText(ws, at(map.brand)) || null) : null,
      model:                map.model          ? (cellText(ws, at(map.model)) || null) : null,
      first_name:           map.first_name     ? (cellText(ws, at(map.first_name)) || null) : null,
      last_name:            map.last_name      ? (cellText(ws, at(map.last_name)) || null) : null,
      email:                map.email          ? (cellText(ws, at(map.email)) || null) : null,
      age:                  map.age            ? cellNum(ws, at(map.age)) : null,
      registered_at:        map.registered_at  ? cellDateISO(ws, at(map.registered_at)) : null,
      app_rating:           map.app_rating     ? cellNum(ws, at(map.app_rating)) : null,
      os:                   map.os             ? (cellText(ws, at(map.os)) || null) : null,
      has_alerts:           map.has_alerts          ? cellBool(ws, at(map.has_alerts)) : false,
      has_security_group:   map.has_security_group  ? cellBool(ws, at(map.has_security_group)) : false,
      used_acompana:        (acompanaRaw || 0) > 0,
      used_night_security:  (nightRaw    || 0) > 0,
      has_widget:           map.has_widget     ? cellBool(ws, at(map.has_widget)) : false,
    });
  }
  const rows = Array.from(byUserId.values());
  // Adjunta metadatos al array para mostrarlos en el preview.
  rows.detectedMap = map;
  rows.duplicatesRemoved = uploadRows - rows.length;
  rows.skippedNoPhone = skippedNoPhone;
  rows.skippedNoUserId = skippedNoUserId;
  rows.allUserIds = allUserIds;   // base para calcular bajas en sincronización
  return rows;
}

//===============================================================
// Upload flow
//===============================================================
document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = '';
  if (!state.activeClone) {
    toast('Selecciona o crea un clon antes de subir un Excel', 'error');
    return;
  }
  const target = state.activeClone;   // clon fijado ANTES de los await
  try {
    const buf = await file.arrayBuffer();
    const rows = parseExcel(buf);
    // Si el master cambió de pestaña de clon durante el parseo, abortar: el
    // preview/sincronización se calcularían contra el censo de otro clon.
    if (state.activeClone !== target) {
      toast('Has cambiado de clon durante la carga; vuelve a seleccionar el Excel.', 'error');
      return;
    }
    if (!rows.length) {
      toast('No se han encontrado filas con teléfono en el Excel.', 'error');
      return;
    }
    state.preview = { rows, filename: file.name, targetClone: target };
    renderPreviewModal();
  } catch (err) {
    console.error(err);
    toast(err.message || 'Error parseando el Excel', 'error');
  }
});

// Construye una in-list de PostgREST segura: cada valor entrecomillado, con las
// comillas internas duplicadas, y todo el token codificado para la URL.
function pgInList(values) {
  return values.map(v => encodeURIComponent('"' + String(v).replace(/"/g, '""') + '"')).join(',');
}

async function confirmUpload() {
  // Leer estado de la casilla y la confirmación tecleada ANTES de cerrar el modal.
  const doSync = !!document.getElementById('syncDelete')?.checked;
  const typed = (document.getElementById('syncConfirmText')?.value || '').trim();
  const { rows, targetClone } = state.preview;
  const sync = state.preview.sync || {};

  // Gate DURO antes de tocar nada: para borrados altos hay que teclear el slug.
  if (doSync && sync.hardGate && typed !== targetClone) {
    toast(`Para confirmar el borrado, escribe el identificador del clon: ${targetClone}`, 'error');
    return;   // modal sigue abierto para que lo escriba
  }
  // Seguridad: si por lo que sea el censo no era válido o había 0 coincidencias,
  // no se borra (la casilla ya iba deshabilitada, pero defensa en profundidad).
  const syncOk = doSync && sync.rowsValid && !sync.zeroOverlap;

  state.preview = null;
  closeModal();
  const tagged = rows.map(r => ({ ...r, clone_slug: targetClone }));
  const total = tagged.length;
  let done = 0;
  showProgressToast(`Subiendo 0 / ${total}…`);
  try {
    const batchSize = 500;
    for (let i = 0; i < tagged.length; i += batchSize) {
      const batch = tagged.slice(i, i + batchSize);
      await sb(USERS_TABLE + '?on_conflict=clone_slug,user_id', {
        method: 'POST',
        headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify(batch),
      });
      done += batch.length;
      updateProgressToast(`Subiendo ${done} / ${total}…`);
    }

    // Fase de sincronización (borrado opt-in). RECALCULA contra la BD FRESCA
    // (no la foto del preview): bajas = user_id que están AHORA en el clon pero
    // NO en el Excel recién subido. Así es inmune a cambios concurrentes y a
    // re-ejecuciones (idempotente). Acotado siempre por clone_slug.
    let deleted = 0;
    if (syncOk) {
      updateProgressToast('Recalculando bajas…');
      const xlsIds = sync.xlsIds instanceof Set ? sync.xlsIds : new Set(sync.xlsIds || []);
      const freshIds = await fetchCloneUserIds(targetClone);
      const ids = [...new Set(freshIds.map(String))].filter(id => !xlsIds.has(id));
      // Salvaguarda final: si el borrado real resulta alto y el usuario no pasó
      // el gate duro (no se le pidió teclear el slug), abortar el borrado.
      const freshCount = freshIds.length;
      const realPct = freshCount ? Math.round(ids.length * 100 / freshCount) : 0;
      const realBig = ids.length >= 50 || realPct >= 50;
      if (ids.length && realBig && !sync.hardGate) {
        hideProgressToast();
        toast(`Subida hecha. Borrado CANCELADO: las bajas reales (${ids.length}) son muchas más de lo previsto; vuelve a subir y confirma el borrado.`, 'error');
        if (state.activeClone === targetClone) { await loadUsers(); render(); }
        return;
      }
      const delBatch = 200;
      for (let i = 0; i < ids.length; i += delBatch) {
        const chunk = ids.slice(i, i + delBatch);
        await sb(`${USERS_TABLE}?clone_slug=eq.${encodeURIComponent(targetClone)}&user_id=in.(${pgInList(chunk)})`, {
          method: 'DELETE',
          headers: { 'Prefer': 'return=minimal' },
        });
        deleted += chunk.length;
        updateProgressToast(`Eliminando bajas ${deleted} / ${ids.length}…`);
      }
    }

    hideProgressToast();
    const cloneName = state.clones.find(c => c.slug === targetClone)?.name || targetClone;
    const msg = deleted
      ? `Cargados ${total} usuarios en "${cloneName}" · ${deleted} bajas eliminadas.`
      : `Cargados ${total} usuarios en "${cloneName}".`;
    toast(msg, 'success');
    if (state.activeClone === targetClone) {
      await loadUsers();
      render();
    }
  } catch (err) {
    hideProgressToast();
    console.error(err);
    // Re-subir el mismo Excel con sync es seguro: el recálculo de bajas es
    // idempotente (se calcula contra la BD fresca en cada intento).
    toast((err.message || 'Error subiendo a Supabase') + ' · Si activaste sincronización, vuelve a subir el mismo Excel para completarla de forma segura.', 'error');
  }
}

//===============================================================
// Filtering
//===============================================================
function passesFilters(row) {
  if (state.globalSearch) {
    const q = state.globalSearch.toLowerCase();
    const hay = [row.first_name, row.last_name, row.email, row.phone, row.brand, row.model]
      .filter(Boolean).map(s => String(s).toLowerCase()).join(' ');
    if (!hay.includes(q)) return false;
  }
  for (const [key, f] of Object.entries(state.filters)) {
    if (f == null) continue;
    const col = COLS.find(c => c.key === key);
    if (!col) continue;
    const v = row[key];
    if (col.type === 'multi') {
      const repr = v == null || v === '' ? '' : String(v);
      if (!f.includes(repr)) return false;
    } else if (col.type === 'text') {
      // f puede ser string (formato antiguo) u objeto {contains, presence}
      const f2 = (typeof f === 'string') ? { contains: f, presence: 'all' } : f;
      const val = String(v || '').trim();
      if (f2.presence === 'filled' && val === '') return false;
      if (f2.presence === 'empty' && val !== '') return false;
      if (f2.contains && !val.toLowerCase().includes(String(f2.contains).toLowerCase())) return false;
    } else if (col.type === 'numrange') {
      const num = v == null ? null : Number(v);
      if (f.min != null && (num == null || num < f.min)) return false;
      if (f.max != null && (num == null || num > f.max)) return false;
    } else if (col.type === 'daterange') {
      const d = v || '';
      if (f.from && (!d || d < f.from)) return false;
      if (f.to && (!d || d > f.to)) return false;
    } else if (col.type === 'bool') {
      const truthy = !!v;
      if (f === 'yes' && !truthy) return false;
      if (f === 'no' && truthy) return false;
    }
  }
  return true;
}

function getFilteredSorted() {
  let r = state.rows.filter(passesFilters);
  const { col, dir } = state.sort;
  const m = dir === 'asc' ? 1 : -1;
  r = r.slice().sort((a, b) => {
    const av = a[col]; const bv = b[col];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * m;
    return String(av).localeCompare(String(bv)) * m;
  });
  return r;
}

//===============================================================
// Render
//===============================================================
function render() {
  renderTabs();
  renderCloneHeader();
  renderStats();
  renderChips();
  renderTable();
  renderRowCount();
  updateUploadBtnState();
}

function renderTabs() {
  const tabs = state.clones.map(c => `
    <button class="tab ${c.slug === state.activeClone ? 'active' : ''}"
            onclick="switchClone('${escapeAttr(c.slug)}')">
      ${escapeHtml(c.name)}
    </button>
  `).join('');
  // "+ Añadir clon" solo para master.
  const addTab = state.isMaster
    ? `<button class="tab add-tab" onclick="openAddCloneModal()">+ Añadir clon</button>`
    : '';
  document.getElementById('tabsRow').innerHTML = tabs + addTab;
}

function renderCloneHeader() {
  const c = getActiveClone();
  const el = document.getElementById('cloneHeader');
  if (!c) {
    el.innerHTML = `<div class="clone-name" style="color:var(--muted);">Crea el primer clon para empezar →</div>`;
    return;
  }
  el.innerHTML = `
    <div class="clone-name">${escapeHtml(c.name)}</div>
    <div class="clone-slug">${escapeHtml(c.slug)}</div>
  `;
}

function renderStats() {
  const all = state.rows;
  const t = all.length;
  const ios = all.filter(r => r.os === 'iOS').length;
  const android = all.filter(r => r.os === 'Android').length;
  const widget = all.filter(r => r.has_widget).length;
  const grupo = all.filter(r => r.has_security_group).length;
  const pct = (n) => t ? Math.round(n * 100 / t) + '%' : '—';
  document.getElementById('stats').innerHTML = `
    <div class="stat red"><div class="label">Usuarios</div><div class="value">${t}</div><div class="sub">en este clon</div></div>
    <div class="stat"><div class="label">iOS</div><div class="value">${ios}</div><div class="sub">${pct(ios)}</div></div>
    <div class="stat"><div class="label">Android</div><div class="value">${android}</div><div class="sub">${pct(android)}</div></div>
    <div class="stat"><div class="label">Widget</div><div class="value">${widget}</div><div class="sub">${pct(widget)}</div></div>
    <div class="stat"><div class="label">Grupo de seguridad</div><div class="value">${grupo}</div><div class="sub">${pct(grupo)}</div></div>
  `;
}

function renderChips() {
  const wrap = document.getElementById('filterChips');
  const chips = [];
  if (state.globalSearch) {
    chips.push(`<span class="chip">Buscar: "${escapeHtml(state.globalSearch)}" <button onclick="clearGlobalSearch()">×</button></span>`);
  }
  for (const [key, f] of Object.entries(state.filters)) {
    if (f == null) continue;
    const col = COLS.find(c => c.key === key);
    if (!col) continue;
    let val = '';
    if (col.type === 'multi') val = (f.length === 0) ? 'ninguno' : (f.length <= 3 ? f.map(x => x || '∅').join(', ') : `${f.length} valores`);
    else if (col.type === 'text') {
      const f2 = (typeof f === 'string') ? { contains: f, presence: 'all' } : f;
      const parts = [];
      if (f2.contains) parts.push(`"${f2.contains}"`);
      if (f2.presence === 'filled') parts.push('con dato');
      if (f2.presence === 'empty') parts.push('vacío');
      val = parts.join(' · ');
    }
    else if (col.type === 'numrange') val = `${f.min ?? '−∞'} ≤ x ≤ ${f.max ?? '∞'}`;
    else if (col.type === 'daterange') val = `${f.from || ''} → ${f.to || ''}`;
    else if (col.type === 'bool') val = f === 'yes' ? 'Sí' : 'No';
    chips.push(`<span class="chip">${col.label}: ${escapeHtml(val)} <button onclick="clearFilter('${key}')">×</button></span>`);
  }
  wrap.innerHTML = chips.join('');
}

function renderTable() {
  const wrap = document.getElementById('tableWrap');
  if (!state.activeClone) {
    wrap.innerHTML = `
      <div class="empty-state">
        <h3>Sin clon seleccionado</h3>
        <p>Pulsa "+ Añadir clon" para crear el primero.</p>
      </div>`;
    return;
  }
  if (state.loading) {
    const c = getActiveClone();
    wrap.innerHTML = `
      <div class="empty-state">
        <h3><span class="loading"></span> Cargando usuarios de "${escapeHtml(c?.name || '')}"…</h3>
        <p>En clones grandes puede tardar unos segundos.</p>
      </div>`;
    return;
  }
  if (!state.rows.length) {
    const c = getActiveClone();
    wrap.innerHTML = `
      <div class="empty-state">
        <h3>"${escapeHtml(c?.name || '')}" no tiene datos todavía</h3>
        <p>Pulsa <strong>Subir Excel</strong> arriba a la derecha para cargar usuarios en este clon.</p>
      </div>`;
    return;
  }
  const filtered = getFilteredSorted();
  const capped = filtered.length > MAX_RENDER_ROWS;
  const visible = capped ? filtered.slice(0, MAX_RENDER_ROWS) : filtered;
  const head = COLS.map(c => {
    const active = state.filters[c.key] != null ? 'active' : '';
    const isSorted = state.sort.col === c.key;
    // Columna activa: ▲ (asc) / ▼ (desc). Resto: ⇅ tenue para indicar que
    // también se puede ordenar al hacer clic.
    const sortInd = isSorted
      ? (state.sort.dir === 'asc' ? '▲' : '▼')
      : '<span class="sort-ind inactive">⇅</span>';
    const indHtml = isSorted ? `<span class="sort-ind">${sortInd}</span>` : sortInd;
    return `
      <th style="text-align:${c.align||'left'}">
        <span class="th-inner" onclick="onSortClick('${c.key}', event)" title="Ordenar por ${c.label}">
          ${c.label} ${indHtml}
        </span>
        <button class="filter-btn ${active}" title="Filtrar" onclick="openFilter('${c.key}', event)">▾</button>
      </th>`;
  }).join('');
  const body = visible.map(r => `
    <tr>
      ${COLS.map(c => `<td style="text-align:${c.align||'left'}">${renderCell(r, c)}</td>`).join('')}
    </tr>
  `).join('');
  const notice = capped ? `
    <div style="padding:10px 14px;background:#FFFBEB;color:#B45309;border-top:1px solid #F59E0B;font-size:12px;">
      Mostrando las primeras ${MAX_RENDER_ROWS.toLocaleString('es-ES')} de
      ${filtered.length.toLocaleString('es-ES')} filas. Usa los filtros o el
      buscador para acotar; los conteos y el export CSV usan el total.
    </div>` : '';
  wrap.innerHTML = `
    <table>
      <thead><tr>${head}</tr></thead>
      <tbody>${body}</tbody>
    </table>
    ${notice}
  `;
}

function renderCell(row, col) {
  const v = row[col.key];
  if (col.type === 'bool') {
    return v ? '<span class="pill yes">Sí</span>' : '<span class="pill no">No</span>';
  }
  if (col.key === 'os') {
    const cls = v === 'iOS' ? 'os-ios' : v === 'Android' ? 'os-android' : 'os-other';
    return `<span class="pill ${cls}">${escapeHtml(v || '—')}</span>`;
  }
  if (col.key === 'app_rating') {
    return v == null ? '<span class="empty-cell">—</span>' : `<span class="rating">${v}</span>`;
  }
  if (v == null || v === '') return '<span class="empty-cell">—</span>';
  return escapeHtml(String(v));
}

function renderRowCount() {
  const el = document.getElementById('rowCount');
  if (!state.activeClone) { el.textContent = ''; return; }
  const total = state.rows.length;
  const filtered = getFilteredSorted().length;
  el.textContent = filtered === total ? `${total} usuarios` : `${filtered} de ${total} usuarios`;
}

function updateUploadBtnState() {
  const btn = document.getElementById('uploadBtn');
  // "Subir Excel" solo para master; para no-master se oculta por completo.
  if (!state.isMaster) {
    btn.style.display = 'none';
    return;
  }
  btn.style.display = '';
  const c = getActiveClone();
  if (c) {
    btn.disabled = false;
    btn.title = `Subir Excel a "${c.name}"`;
    btn.textContent = 'Subir Excel';
  } else {
    btn.disabled = true;
    btn.title = 'Crea o selecciona un clon primero';
    btn.textContent = 'Subir Excel';
  }
}

//===============================================================
// Filter popover
//===============================================================
function openFilter(key, event) {
  event.stopPropagation();
  const col = COLS.find(c => c.key === key);
  const btn = event.currentTarget;
  const r = btn.getBoundingClientRect();
  const top = r.bottom + window.scrollY + 4;
  const left = Math.min(r.left + window.scrollX, window.innerWidth - 260);

  let body = '';
  const cur = state.filters[key];
  if (col.type === 'text') {
    const f2 = (typeof cur === 'string') ? { contains: cur, presence: 'all' } : (cur || { contains: '', presence: 'all' });
    const filled = state.rows.filter(r => String(r[key] || '').trim() !== '').length;
    const empty = state.rows.length - filled;
    const p = f2.presence || 'all';
    body = `
      <input type="text" id="popInput" placeholder="Contiene…" value="${escapeAttr(f2.contains || '')}">
      <div style="margin-top:8px;border-top:1px solid var(--line);padding-top:8px;">
        <label><input type="radio" name="presence" value="all"    ${p === 'all' ? 'checked' : ''}> Todos</label>
        <label><input type="radio" name="presence" value="filled" ${p === 'filled' ? 'checked' : ''}> Con dato (${filled})</label>
        <label><input type="radio" name="presence" value="empty"  ${p === 'empty' ? 'checked' : ''}> Vacío (${empty})</label>
      </div>`;
  } else if (col.type === 'multi') {
    const values = uniqueValues(key);
    const sel = cur ? new Set(cur) : new Set(values);
    body = `
      <div class="opts-list">
        ${values.map(v => `
          <label><input type="checkbox" value="${escapeAttr(v)}" ${sel.has(v) ? 'checked' : ''}> ${escapeHtml(v || '(vacío)')}</label>
        `).join('')}
      </div>
      <div style="display:flex;gap:6px;margin-top:6px;">
        <button onclick="popMultiAll(true)">Todos</button>
        <button onclick="popMultiAll(false)">Ninguno</button>
      </div>`;
  } else if (col.type === 'numrange') {
    body = `
      <div class="row">
        <input type="number" id="popMin" placeholder="Mín" value="${cur && cur.min != null ? cur.min : ''}">
        <input type="number" id="popMax" placeholder="Máx" value="${cur && cur.max != null ? cur.max : ''}">
      </div>`;
  } else if (col.type === 'daterange') {
    body = `
      <div class="row">
        <input type="date" id="popFrom" value="${(cur && cur.from) || ''}">
        <input type="date" id="popTo" value="${(cur && cur.to) || ''}">
      </div>`;
  } else if (col.type === 'bool') {
    body = `
      <label><input type="radio" name="boolFilter" value="all" ${!cur ? 'checked' : ''}> Todos</label>
      <label><input type="radio" name="boolFilter" value="yes" ${cur === 'yes' ? 'checked' : ''}> Sí</label>
      <label><input type="radio" name="boolFilter" value="no" ${cur === 'no' ? 'checked' : ''}> No</label>`;
  }

  const html = `
    <div class="popover" style="top:${top}px; left:${left}px;" onclick="event.stopPropagation()">
      <h4>${col.label}</h4>
      ${body}
      <div class="actions">
        <button onclick="clearFilter('${key}'); closePopover();">Limpiar</button>
        <button class="primary" onclick="applyFilter('${key}', '${col.type}')">Aplicar</button>
      </div>
    </div>`;
  document.getElementById('popoverRoot').innerHTML = html;
  setTimeout(() => {
    const inp = document.getElementById('popInput');
    if (inp) inp.focus();
  }, 50);
}

function popMultiAll(all) {
  const cbs = document.querySelectorAll('#popoverRoot .opts-list input[type=checkbox]');
  cbs.forEach(c => c.checked = all);
}

function applyFilter(key, type) {
  if (type === 'text') {
    const contains = document.getElementById('popInput').value.trim();
    const presenceEl = document.querySelector('#popoverRoot input[name=presence]:checked');
    const presence = presenceEl ? presenceEl.value : 'all';
    // Sin texto y "Todos" → sin filtro.
    state.filters[key] = (!contains && presence === 'all') ? null : { contains, presence };
  } else if (type === 'multi') {
    const cbs = document.querySelectorAll('#popoverRoot .opts-list input[type=checkbox]');
    const sel = Array.from(cbs).filter(c => c.checked).map(c => c.value);
    const all = uniqueValues(key);
    state.filters[key] = (sel.length === all.length) ? null : sel;
  } else if (type === 'numrange') {
    const minV = document.getElementById('popMin').value;
    const maxV = document.getElementById('popMax').value;
    if (!minV && !maxV) state.filters[key] = null;
    else state.filters[key] = { min: minV ? Number(minV) : null, max: maxV ? Number(maxV) : null };
  } else if (type === 'daterange') {
    const from = document.getElementById('popFrom').value;
    const to = document.getElementById('popTo').value;
    if (!from && !to) state.filters[key] = null;
    else state.filters[key] = { from: from || null, to: to || null };
  } else if (type === 'bool') {
    const v = document.querySelector('#popoverRoot input[name=boolFilter]:checked').value;
    state.filters[key] = (v === 'all') ? null : v;
  }
  closePopover();
  render();
}

function clearFilter(key) {
  delete state.filters[key];
  render();
}

function closePopover() {
  document.getElementById('popoverRoot').innerHTML = '';
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.popover') && !e.target.closest('.filter-btn')) closePopover();
});

function uniqueValues(key) {
  const set = new Set();
  for (const r of state.rows) {
    set.add(r[key] == null || r[key] === '' ? '' : String(r[key]));
  }
  return Array.from(set).sort((a, b) => a.localeCompare(b));
}

//===============================================================
// Sort + global search
//===============================================================
function onSortClick(key) {
  if (state.sort.col === key) {
    state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    // Primer clic en una columna nueva: fechas y números arrancan de MAYOR a
    // MENOR (más reciente / más alto primero), que es lo que se suele querer;
    // el texto arranca de A→Z.
    const col = COLS.find(c => c.key === key);
    const firstDir = (col && (col.type === 'daterange' || col.type === 'numrange')) ? 'desc' : 'asc';
    state.sort = { col: key, dir: firstDir };
  }
  render();
}
function onGlobalSearch(e) {
  state.globalSearch = e.target.value.trim();
  render();
}
function clearGlobalSearch() {
  state.globalSearch = '';
  document.getElementById('globalSearch').value = '';
  render();
}

//===============================================================
// CSV export
//===============================================================
function exportCsv() {
  const rows = getFilteredSorted();
  if (!rows.length) { toast('No hay filas para exportar', 'error'); return; }
  const headers = COLS.map(c => c.label);
  const lines = [headers.join(';')];
  for (const r of rows) {
    const cells = COLS.map(c => {
      let v = r[c.key];
      if (c.type === 'bool') v = v ? 'Sí' : 'No';
      if (v == null) v = '';
      v = String(v);
      // Anti CSV/formula injection: si el valor empieza por = + - @ (o tab/CR),
      // Excel/Sheets lo interpretaría como fórmula. Lo neutralizamos con un
      // apóstrofo inicial para que se trate como texto literal.
      if (/^[=+\-@\t\r]/.test(v)) v = "'" + v;
      v = v.replace(/"/g, '""');
      if (/[;"\n]/.test(v)) v = `"${v}"`;
      return v;
    });
    lines.push(cells.join(';'));
  }
  const csv = '﻿' + lines.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = new Date().toISOString().slice(0, 10);
  const cloneSlug = state.activeClone || 'sin-clon';
  a.href = url;
  a.download = `${cloneSlug}-usuarios-${today}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

//===============================================================
// Modal (preview upload)
//===============================================================
function renderPreviewModal() {
  const { rows, filename, targetClone } = state.preview;
  const cloneName = state.clones.find(c => c.slug === targetClone)?.name || targetClone;
  const sample = rows.slice(0, 10);

  // --- Sincronización (borrado opt-in): qué usuarios del clon NO están en el Excel.
  // xlsIds = TODOS los user_id presentes en el Excel (incluidas filas sin teléfono),
  // leídos en crudo en parseExcel → un usuario presente en el Excel nunca es baja.
  // El conteo del preview es informativo; confirmUpload RECALCULA contra la BD fresca.
  const xlsIds = (rows.allUserIds instanceof Set)
    ? rows.allUserIds
    : new Set(rows.map(r => r.user_id != null ? String(r.user_id) : '').filter(Boolean));
  // ¿El censo cargado (state.rows) corresponde de verdad a este clon y se cargó OK?
  const rowsValid = state.rowsLoadedSlug === targetClone;
  const dbRows = rowsValid ? state.rows.filter(r => r.user_id != null && r.user_id !== '') : [];
  const dbCount = dbRows.length;
  const overlap = dbRows.filter(r => xlsIds.has(String(r.user_id))).length;
  const toDelete = dbRows.filter(r => !xlsIds.has(String(r.user_id)));
  const delN = toDelete.length;
  const delPct = dbCount ? Math.round(delN * 100 / dbCount) : 0;
  const delSample = toDelete.slice(0, 8)
    .map(r => escapeHtml([r.first_name, r.last_name].filter(Boolean).join(' ') || r.email || r.phone || r.user_id))
    .join(', ');
  const bigDelete = delN > 0 && (delPct >= 30 || delN >= 50);
  // 0 coincidencias con un clon que YA tiene usuarios = casi seguro Excel/columna
  // equivocada → se bloquea la sincronización por completo.
  const zeroOverlap = dbCount > 0 && overlap === 0;
  // Borrado alto → exige teclear el identificador del clon (rompe el "confirmar por inercia").
  const hardGate = !zeroOverlap && delN > 0 && (delPct >= 50 || delN >= 50);
  // Guardamos en state.preview lo que confirmUpload necesita para RECALCULAR.
  state.preview.sync = { xlsIds, targetClone, rowsValid, zeroOverlap, hardGate, previewDelN: delN, dbCount };

  let syncInner;
  if (!rowsValid) {
    syncInner = `<div class="warn-box">No se ha podido verificar el censo actual de este clon (la carga falló o está incompleta). Recarga la página antes de usar la sincronización.</div>`;
  } else if (zeroOverlap) {
    syncInner = `<div class="danger-box">Este Excel <strong>no comparte ningún usuario</strong> con los ${dbCount} ya cargados en este clon. Casi seguro es el Excel equivocado o la columna de ID está mal detectada, así que la sincronización (borrado) queda <strong>bloqueada</strong> por seguridad. La subida normal (alta/actualización) sí se puede hacer.</div>`;
  } else if (delN === 0) {
    syncInner = `<div class="muted-note">No hay bajas: los ${dbCount} usuarios del clon están en el Excel. No se eliminaría nada.</div>`;
  } else {
    syncInner = `<div class="${bigDelete ? 'danger-box' : 'warn-box'}">
        Se eliminará${delN === 1 ? '' : 'n'} <strong>${delN}</strong> ${delN === 1 ? 'usuario' : 'usuarios'} (${delPct}% de ${dbCount}; ${overlap} del Excel coinciden con el panel)
        que est${delN === 1 ? 'á' : 'án'} en el panel pero <strong>NO</strong> en este Excel.
        ${bigDelete ? '<br><strong>⚠️ Proporción alta. Revisa que el Excel esté completo.</strong>' : ''}
        <div style="margin-top:6px;font-size:12px;">Ejemplos: ${delSample}${delN > 8 ? ` … (+${delN - 8} más)` : ''}</div>
        ${hardGate ? `<div style="margin-top:8px;">Para confirmar el borrado, escribe el identificador del clon <code>${escapeHtml(targetClone)}</code>:<br>
          <input type="text" id="syncConfirmText" placeholder="${escapeHtml(targetClone)}" autocomplete="off" style="margin-top:4px;width:auto;"></div>` : ''}
      </div>`;
  }
  const syncDisabled = (!rowsValid || zeroOverlap) ? 'disabled' : '';
  const syncHtml = `
    <div class="sync-box">
      <label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer;">
        <input type="checkbox" id="syncDelete" ${syncDisabled}
               onchange="var d=document.getElementById('syncDetails'); if(d) d.style.display=this.checked?'block':'none';">
        <span style="font-size:13px;">Sincronizar: <strong>eliminar del panel</strong> los usuarios de
        este clon que ya no aparecen en el Excel. <span style="color:var(--muted);">(desactivado por defecto)</span></span>
      </label>
      <div id="syncDetails" style="display:${(!rowsValid || zeroOverlap) ? 'block' : 'none'};margin-top:10px;">${syncInner}</div>
    </div>`;
  const cols = ['phone', 'first_name', 'last_name', 'email', 'os', 'brand', 'registered_at'];
  const map = rows.detectedMap || {};
  const mapEntries = [
    ['phone',              'Teléfono'],
    ['country_code',       'Cód. País'],
    ['first_name',         'Nombre'],
    ['last_name',          'Apellidos'],
    ['email',              'Email'],
    ['age',                'Edad'],
    ['os',                 'SO'],
    ['brand',              'Marca'],
    ['registered_at',      'F. registro'],
    ['app_rating',         'Valoración'],
    ['has_alerts',         'Alertas'],
    ['has_security_group', 'Grupo seg.'],
    ['used_acompana',      'Acompaña'],
    ['used_night_security','Seg. noct.'],
    ['has_widget',         'Widget'],
  ];
  const mapHtml = mapEntries.map(([f, l]) => {
    const letter = map[f];
    const cls = letter ? 'mapped' : 'unmapped';
    return `<span class="map-pill ${cls}">${l}: <strong>${letter || '—'}</strong></span>`;
  }).join('');

  const html = `
    <div class="backdrop" onclick="if(event.target===this)cancelUpload()">
      <div class="modal">
        <h2>Confirmar subida · ${escapeHtml(filename)}</h2>
        <div class="body">
          <div class="target-clone">
            Los datos se cargarán en el clon <strong>${escapeHtml(cloneName)}</strong>. Los demás clones no se ven afectados.
          </div>
          <p>Se han detectado <strong>${rows.length}</strong> usuarios únicos en el Excel${rows.duplicatesRemoved ? ` (deduplicados ${rows.duplicatesRemoved} user_id repetidos: se queda la última ocurrencia)` : ''}. Upsert por (clon + user_id): los existentes se actualizan, los nuevos se insertan.</p>
          ${(rows.skippedNoPhone || rows.skippedNoUserId) ? `
          <p style="font-size:12px;color:var(--muted);margin-top:-4px;">
            Filas descartadas: ${rows.skippedNoPhone} sin teléfono${rows.skippedNoUserId ? `, ${rows.skippedNoUserId} sin user_id` : ''} (cuentas internas/admin sin datos de usuario real).
          </p>` : ''}
          <details style="margin-top:8px;margin-bottom:12px;">
            <summary style="cursor:pointer;font-size:12px;color:var(--muted);">Mapeo de columnas detectado (${Object.keys(map).length} de ${mapEntries.length} campos)</summary>
            <div class="map-pills">${mapHtml}</div>
          </details>
          ${syncHtml}
          <div class="preview-table">
            <table>
              <thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
              <tbody>
                ${sample.map(r => `<tr>${cols.map(c => `<td>${escapeHtml(r[c] ?? '')}</td>`).join('')}</tr>`).join('')}
              </tbody>
            </table>
          </div>
          <p style="font-size:12px;color:var(--muted);margin-top:8px;">Mostrando ${sample.length} de ${rows.length} filas. La subida puede tardar ~1 min para volúmenes grandes (50k+).</p>
        </div>
        <div class="footer">
          <button onclick="cancelUpload()">Cancelar</button>
          <button class="primary" onclick="confirmUpload()">Subir a "${escapeHtml(cloneName)}"</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modalRoot').innerHTML = html;
}
function cancelUpload() {
  state.preview = null;
  closeModal();
}
function closeModal() {
  document.getElementById('modalRoot').innerHTML = '';
}

//===============================================================
// Toast
//===============================================================
function toast(msg, type = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.getElementById('toastRoot').appendChild(t);
  setTimeout(() => t.remove(), 4000);
}
let progressToastEl = null;
function showProgressToast(msg) {
  hideProgressToast();
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span class="loading"></span><span class="msg">${escapeHtml(msg)}</span>`;
  progressToastEl = t;
  document.getElementById('toastRoot').appendChild(t);
}
function updateProgressToast(msg) {
  if (!progressToastEl) return;
  progressToastEl.querySelector('.msg').textContent = msg;
}
function hideProgressToast() {
  if (progressToastEl) { progressToastEl.remove(); progressToastEl = null; }
}

//===============================================================
// Util
//===============================================================
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}
function escapeAttr(s) { return escapeHtml(s); }

//===============================================================
// Auth · login / logout
//===============================================================
function renderLogin(errorMsg) {
  document.body.classList.remove('booting');
  const html = `
    <div class="login-screen" id="loginScreen">
      <form class="login-card" onsubmit="doLogin(event)">
        <h1 class="brand-title-login">Panel de Control</h1>
        <p class="sub">Acceso privado</p>
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" autocomplete="username" required autofocus>
        <label for="loginPass">Contraseña</label>
        <input type="password" id="loginPass" autocomplete="current-password" required>
        <div class="error ${errorMsg ? 'show' : ''}" id="loginError">${errorMsg ? escapeHtml(errorMsg) : ''}</div>
        <button type="submit" class="primary" id="loginBtn">Entrar</button>
      </form>
    </div>`;
  document.getElementById('modalRoot').innerHTML = html;
}

function closeLogin() {
  document.getElementById('modalRoot').innerHTML = '';
}

async function doLogin(event) {
  event.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('loginError');
  btn.disabled = true;
  btn.textContent = 'Entrando…';
  errEl.classList.remove('show');
  try {
    const { data, error } = await supa.auth.signInWithPassword({ email, password });
    if (error) throw error;
    session = data.session;
    // Reiniciar el reloj de inactividad con el nuevo login.
    touchActivity._last = 0;
    touchActivity();
    closeLogin();
    document.body.classList.add('booting');
    await afterLogin();
  } catch (err) {
    console.error(err);
    errEl.textContent = 'Email o contraseña incorrectos.';
    errEl.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}

async function doLogout() {
  try { await supa.auth.signOut(); } catch (e) { /* ignore */ }
  session = null;
  try { localStorage.removeItem(LS_LAST_ACTIVITY); } catch (e) { /* ignore */ }
  location.reload();
}

//===============================================================
// Auth · cierre de sesión por inactividad
//===============================================================
// Tras INACTIVITY_LIMIT_MS sin actividad (clic, tecla, scroll, ratón,
// toque) se cierra la sesión y se vuelve al login. El timestamp vive en
// localStorage para que la actividad en cualquier pestaña del panel
// cuente para todas, y para poder comprobarlo al reabrir el navegador.
// El override por localStorage existe solo para poder probarlo con un
// límite corto; sin override aplica el valor de producción (10 min).
const INACTIVITY_LIMIT_MS =
  Number(localStorage.getItem('safy_panel_inactivity_override_ms')) || 10 * 60 * 1000;
const LS_LAST_ACTIVITY = 'safy_panel_last_activity';

function touchActivity() {
  // Atenuado: como mucho una escritura cada 30 s. Tolerancia: el cierre
  // puede llegar hasta 30 s antes de los 10 min exactos. Irrelevante aquí.
  const now = Date.now();
  if (now - (touchActivity._last || 0) < 30000) return;
  touchActivity._last = now;
  try { localStorage.setItem(LS_LAST_ACTIVITY, String(now)); } catch (e) { /* ignore */ }
}

function lastActivity() {
  const v = Number(localStorage.getItem(LS_LAST_ACTIVITY));
  return Number.isFinite(v) && v > 0 ? v : null;
}

async function inactivityLogout() {
  try { await supa.auth.signOut(); } catch (e) { /* ignore */ }
  session = null;
  try { localStorage.removeItem(LS_LAST_ACTIVITY); } catch (e) { /* ignore */ }
  // Vaciar datos en memoria y DOM antes de mostrar el login.
  state.rows = [];
  state.clones = [];
  state.activeClone = null;
  state.isMaster = false;
  render();
  renderLogin('Sesión cerrada por inactividad.');
}

['click', 'keydown', 'scroll', 'mousemove', 'touchstart'].forEach(ev =>
  document.addEventListener(ev, touchActivity, { passive: true }));

setInterval(() => {
  if (!session) return;
  const last = lastActivity();
  if (last && Date.now() - last > INACTIVITY_LIMIT_MS) inactivityLogout();
}, 30000);

//===============================================================
// Boot
//===============================================================
async function afterLogin() {
  try {
    // ¿Es master? Con RLS, clone_access solo devuelve las filas propias.
    let access = [];
    try { access = await sb(`clone_access?select=is_master`); } catch (e) { access = []; }
    state.isMaster = Array.isArray(access) && access.some(a => a.is_master);

    await loadClones();   // RLS filtra a los clones permitidos

    if (!state.clones.length) {
      // Usuario autenticado pero sin acceso a ningún clon.
      document.body.classList.remove('booting');
      render();
      document.getElementById('tableWrap').innerHTML = `
        <div class="empty-state">
          <h3>Tu cuenta no tiene acceso a ningún clon</h3>
          <p>Contacta con el administrador de Safy para que te dé acceso.</p>
        </div>`;
      return;
    }

    const remembered = sessionStorage.getItem(SS_KEY);
    state.activeClone = (remembered && state.clones.find(c => c.slug === remembered)?.slug)
      || state.clones[0]?.slug
      || null;
    // Mostrar ya la interfaz con estado "cargando" ANTES de traer los usuarios
    // (un clon grande puede tardar varios segundos en cargar/pintar).
    state.loading = true;
    document.body.classList.remove('booting');
    render();
    if (state.activeClone) {
      try { await loadUsers(); } finally { state.loading = false; }
    } else {
      state.loading = false;
    }
  } catch (err) {
    console.error(err);
    state.loading = false;
    toast('No se pudo cargar la base de datos: ' + err.message, 'error');
  }
  document.body.classList.remove('booting');
  render();
}

(async () => {
  try {
    const { data } = await supa.auth.getSession();
    session = data.session;
  } catch (e) {
    session = null;
  }
  if (!session) {
    renderLogin();
    return;
  }
  // Cierre por inactividad: si la última actividad registrada supera el
  // límite (p.ej. cerró la pestaña y vuelve días después con la sesión
  // persistida), no entramos — se pide login de nuevo.
  const last = lastActivity();
  if (last && Date.now() - last > INACTIVITY_LIMIT_MS) {
    await inactivityLogout();
    return;
  }
  // Sesión válida y reciente (o primer uso): inicializar el reloj.
  touchActivity._last = 0;
  touchActivity();
  await afterLogin();
})();
</script>
